[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-job-matcher"
version = "0.1.0"
description = "Match a CV against a job description: extract skills, score the fit, and suggest improvements."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mykhaylo Zhyhan" }]
keywords = ["cv", "resume", "job-matching", "document-extraction", "nlp", "skills"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing",
]

dependencies = [
    "pypdf>=5.0",
    "python-docx>=1.1",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/mzhyhan/cv-job-matcher"
Issues = "https://github.com/mzhyhan/cv-job-matcher/issues"

[tool.setuptools.packages.find]
include = ["cv_matcher*"]

[tool.setuptools.package-data]
cv_matcher = ["py.typed", "data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D107"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
pretty = true
files = ["cv_matcher", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests", "cv_matcher"]
addopts = "-ra --doctest-modules"

[tool.coverage.run]
source = ["cv_matcher"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]
